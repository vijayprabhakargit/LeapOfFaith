<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Cat reading a newspaper">
  <!-- newspaper -->
  <rect x="7" y="30" width="50" height="27" rx="3" fill="#ffffff" stroke="#cdc6b8" stroke-width="1.5" />
  <line x1="32" y1="30" x2="32" y2="57" stroke="#e4dfd3" stroke-width="1.5" />
  <rect x="11" y="34" width="17" height="3.2" rx="1.6" fill="#8b9096" />
  <rect x="11" y="40" width="17" height="2.6" rx="1.3" fill="#c3c8cc" />
  <rect x="11" y="44.5" width="17" height="2.6" rx="1.3" fill="#c3c8cc" />
  <rect x="11" y="49" width="12" height="2.6" rx="1.3" fill="#c3c8cc" />
  <rect x="36" y="34" width="17" height="8.5" rx="1.6" fill="#dfe3e6" />
  <rect x="36" y="45.5" width="17" height="2.6" rx="1.3" fill="#c3c8cc" />
  <rect x="36" y="50" width="13" height="2.6" rx="1.3" fill="#c3c8cc" />

  <!-- cat -->
  <g>
    <!-- ears -->
    <path d="M18 22 L14 7 L28 14 Z" fill="#f7a72c" stroke="#8a5a00" stroke-width="1.7" stroke-linejoin="round" />
    <path d="M46 22 L50 7 L36 14 Z" fill="#f7a72c" stroke="#8a5a00" stroke-width="1.7" stroke-linejoin="round" />
    <path d="M19.5 19 L17 11 L25.5 15 Z" fill="#f6c9a4" />
    <path d="M44.5 19 L47 11 L38.5 15 Z" fill="#f6c9a4" />
    <!-- head -->
    <ellipse cx="32" cy="26" rx="16.5" ry="14" fill="#f7a72c" stroke="#8a5a00" stroke-width="1.7" />
    <!-- eyes -->
    <ellipse cx="25" cy="24.5" rx="3.1" ry="3.7" fill="#2b2118" />
    <ellipse cx="39" cy="24.5" rx="3.1" ry="3.7" fill="#2b2118" />
    <circle cx="26.2" cy="23.4" r="1" fill="#ffffff" />
    <circle cx="40.2" cy="23.4" r="1" fill="#ffffff" />
    <!-- nose + mouth -->
    <path d="M32 28.6 l-2.1 1.7 h4.2 z" fill="#e07a5f" />
    <path d="M32 30.6 v1.6 M32 32.2 q-2 1.7 -3.7 0 M32 32.2 q2 1.7 3.7 0" fill="none" stroke="#8a5a00" stroke-width="1.2" stroke-linecap="round" />
    <!-- whiskers -->
    <path d="M15 26 h6 M15 29 h6 M49 26 h-6 M49 29 h-6" stroke="#8a5a00" stroke-width="1.1" stroke-linecap="round" />
  </g>

  <!-- paws on the paper -->
  <rect x="13" y="29" width="11" height="10" rx="5" fill="#f7a72c" stroke="#8a5a00" stroke-width="1.5" />
  <rect x="40" y="29" width="11" height="10" rx="5" fill="#f7a72c" stroke="#8a5a00" stroke-width="1.5" />
</svg>
